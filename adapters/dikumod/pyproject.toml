[project]
name = "pachimudeditor-adapter-dikumod"
version = "0.1.0"
description = "Adapter Diku Modificato di pachimudeditor: file dati Diku (libreria dikumod_lib inclusa)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IlPachi" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pachimudeditor>=0.1.0,<0.2",
]

[project.entry-points."pachimudeditor.adapters"]
dikumod = "pachimudeditor_adapter_dikumod.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pachimudeditor_adapter_dikumod"]

[tool.uv.sources]
pachimudeditor = { workspace = true }
