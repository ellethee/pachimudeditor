[project]
name = "pachimudeditor-adapter-mapping"
version = "0.1.0"
description = "Adapter generico di pachimudeditor: qualunque MUD su file descritto da un YAML di mappatura"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IlPachi" }]
keywords = ["mud", "pachimudeditor", "adapter", "yaml", "mapping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Private :: Do Not Upload",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
dependencies = [
    "pachimudeditor>=0.1.0,<0.2",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://pachimudeditor.ilpachi.it/"
Documentation = "https://pachimudeditor.ilpachi.it/"
Repository = "https://github.com/ellethee/pachimudeditor"
Issues = "https://github.com/ellethee/pachimudeditor/issues"
Changelog = "https://github.com/ellethee/pachimudeditor/blob/main/CHANGELOG.md"

[project.entry-points."pachimudeditor.adapters"]
mapping = "pachimudeditor_adapter_mapping.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pachimudeditor_adapter_mapping"]

[tool.uv.sources]
pachimudeditor = { workspace = true }
