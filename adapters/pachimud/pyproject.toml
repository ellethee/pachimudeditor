[project]
name = "pachimudeditor-adapter-pachimud"
version = "0.1.1"
description = "Adapter pachimud di pachimudeditor: legge e scrive il database del gioco (SQLAlchemy) e porta le pagine world/giocatori/istanze/trasferimento/contenuti"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IlPachi" }]
keywords = ["mud", "pachimudeditor", "adapter", "pachimud", "sqlalchemy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
dependencies = [
    "pachimudeditor>=0.1.1,<0.2",
    # Il database di gioco si legge con SQLAlchemy async (nessuna dipendenza dal pacchetto `pachimud`; i modelli ORM sono copiati in `game_models/`).
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0", # hash delle password degli account di gioco (stessi parametri del gioco)
    "pyyaml>=6.0",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://pachimudeditor.ilpachi.it/"
Documentation = "https://pachimudeditor.ilpachi.it/"
Repository = "https://github.com/ellethee/pachimudeditor"
Issues = "https://github.com/ellethee/pachimudeditor/issues"
Changelog = "https://github.com/ellethee/pachimudeditor/blob/main/CHANGELOG.md"

[project.entry-points."pachimudeditor.adapters"]
pachimud = "pachimudeditor_adapter_pachimud.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pachimudeditor_adapter_pachimud"]

[tool.uv.sources]
pachimudeditor = { workspace = true }
