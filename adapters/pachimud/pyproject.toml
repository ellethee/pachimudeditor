[project]
name = "pachimudeditor-adapter-pachimud"
version = "0.1.0"
description = "Adapter pachimud di pachimudeditor: legge e scrive il database del gioco (SQLAlchemy) e porta le pagine world/giocatori/istanze/trasferimento/contenuti"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IlPachi" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pachimudeditor>=0.1.0,<0.2",
    # Il database di gioco si legge con SQLAlchemy async (nessuna dipendenza dal pacchetto `pachimud`).
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0", # hash delle password degli account di gioco (stessi parametri del gioco)
    "pyyaml>=6.0",
    "ruamel-yaml>=0.19.1",
]

[project.entry-points."pachimudeditor.adapters"]
pachimud = "pachimudeditor_adapter_pachimud.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pachimudeditor_adapter_pachimud"]

[tool.uv.sources]
pachimudeditor = { workspace = true }
