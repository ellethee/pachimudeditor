[project]
name = "pachimudeditor-adapter-basedmud"
version = "0.1.0"
description = "Adapter basedmud / ROM di pachimudeditor: file area .are (libreria rom_lib inclusa)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IlPachi" }]
keywords = ["mud", "pachimudeditor", "adapter", "rom", "basedmud", "quickmud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Private :: Do Not Upload",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
dependencies = [
    "pachimudeditor>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://pachimudeditor.ilpachi.it/"
Documentation = "https://pachimudeditor.ilpachi.it/"
Repository = "https://github.com/ellethee/pachimudeditor"
Issues = "https://github.com/ellethee/pachimudeditor/issues"
Changelog = "https://github.com/ellethee/pachimudeditor/blob/main/CHANGELOG.md"

[project.entry-points."pachimudeditor.adapters"]
basedmud = "pachimudeditor_adapter_basedmud.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pachimudeditor_adapter_basedmud"]

[tool.uv.sources]
pachimudeditor = { workspace = true }
