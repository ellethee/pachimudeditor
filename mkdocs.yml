site_name: pachimudeditor
site_description: Editor web di zone, stanze, mob e oggetti per pachimud e altri MUD, esteso da adapter
site_url: !ENV [DOCS_SITE_URL, "https://ellethee.github.io/pachimudeditor/"]
docs_dir: docs
hooks:
  - scripts/mkdocs_hooks.py
repo_url: https://github.com/ellethee/pachimudeditor
repo_name: ellethee/pachimudeditor
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  language: it
  font: false
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: it
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
validation:
  links:
    anchors: warn
nav:
  - Home: index.md
  - Guida:
      - Installazione: guide/installation.md
      - Avvio e comandi: guide/cli.md
      - Configurazione dei mondi: guide/configuration.md
  - Backend:
      - Panoramica: backend/index.md
      - Contratto API: backend/contract.md
      - World: backend/contract-world.md
      - Players: backend/contract-players.md
      - Instances: backend/contract-instances.md
      - Transfer: backend/contract-transfer.md
      - Content: backend/contract-content.md
  - Frontend: frontend/index.md
  - Adapter:
      - Panoramica: adapters/index.md
      - SDK e adapter esterni: adapters/sdk.md
      - pachimud: adapters/pachimud.md
      - basedmud: adapters/basedmud.md
      - dikumod: adapters/dikumod.md
      - mapping: adapters/mapping.md
      - Guida alla mappatura: adapters/mapping-guide.md
  - Formati:
      - Diku Modificato: formats/dikumod.md
  - Conversione: conversion.md
  - Contribuire: contributing.md
  - Rilasci: releasing.md
  - Changelog: changelog.md
