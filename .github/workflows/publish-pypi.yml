name: Pubblicazione su PyPI

# Tag `<pacchetto>-vX.Y.Z` -> PyPI (environment `pypi`). Avvio manuale -> TestPyPI (environment `testpypi`).
# Trusted publishing (OIDC): nessun token. Procedura e configurazione: RELEASING.md.
on:
  push:
    tags:
      - "pachimudeditor-v[0-9]*.[0-9]*.[0-9]*"
      - "pachimudeditor-adapter-*-v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      package:
        description: Pacchetto da pubblicare su TestPyPI
        required: true
        type: choice
        options:
          - pachimudeditor
          - pachimudeditor-adapter-pachimud
          - pachimudeditor-adapter-basedmud
          - pachimudeditor-adapter-dikumod
          - pachimudeditor-adapter-mapping

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
      directory: ${{ steps.meta.outputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fallisce se tag e versione del pyproject non coincidono o se c'e' ancora 'Private :: Do Not Upload'.
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$EVENT" = "push" ]; then
            python3 scripts/release_check.py tag "$TAG" | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/release_check.py package "$PACKAGE" | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - if: needs.prepare.outputs.package == 'pachimudeditor'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - if: needs.prepare.outputs.package == 'pachimudeditor'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend (solo core)
        if: needs.prepare.outputs.package == 'pachimudeditor'
        run: |
          uv sync --frozen --no-dev
          (cd frontend && pnpm install --frozen-lockfile)
          uv run --frozen --no-dev pachimudeditor build-frontend --skip-install
      - name: Build
        env:
          PACKAGE: ${{ needs.prepare.outputs.package }}
        run: uv build --package "$PACKAGE" --out-dir dist
      - name: Controlli sul pacchetto
        env:
          PACKAGE: ${{ needs.prepare.outputs.package }}
        run: |
          uvx twine check --strict dist/*
          python3 scripts/release_check.py wheel "$PACKAGE" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.prepare.outputs.package }}/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv publish --trusted-publishing always dist/*

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/${{ needs.prepare.outputs.package }}/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*
