  - vnum: 400020
    name: Banchina Nord
    description: Una lunga banchina di legno si allunga sull'acqua scura del fiordo, corde e ceste ammucchiate lungo il bordo.
    sector_type: CITY
    exits:
      east:
        target_vnum: 400023
      north:
        target_vnum: 400008
      south:
        target_vnum: 400024
  - vnum: 400021
    name: Magazzini del Porto
    description: Grandi magazzini di legno custodiscono casse e botti in attesa di essere caricate sulle navi.
    sector_type: CITY
    exits:
      down:
        target_vnum: 400026
      south:
        target_vnum: 400022
  - vnum: 400022
    name: Capitaneria di Porto
    description: Un piccolo ufficio pieno di mappe e registri, dove il capitano del porto tiene traccia di ogni nave in arrivo.
    exits:
      west:
        target_vnum: 400023
      north:
        target_vnum: 400021
  - vnum: 400023
    name: Faro di Ravnfjord
    description: Un faro di pietra si erge all'imboccatura del fiordo, la sua luce guida da generazioni le navi verso il porto.
    sector_type: CITY
    exits:
      east:
        target_vnum: 400022
      west:
        target_vnum: 400020
  - vnum: 400024
    name: Nave "Corvo del Fiordo" — Ponte
    description: Il ponte di una robusta nave mercantile ormeggiata al molo, le vele arrotolate e pronte per la prossima partenza.
    sector_type: WATER_SWIM
    exits:
      down:
        target_vnum: 400025
      north:
        target_vnum: 400020
  - vnum: 400025
    name: Nave "Corvo del Fiordo" — Stiva
    description: Una stiva buia, piena di casse legate strette per il viaggio.
    exits:
      up:
        target_vnum: 400024
  - vnum: 400026
    name: Passaggio Segreto
    description: Uno stretto passaggio scavato dietro le assi di un magazzino, nascosto agli occhi distratti.
    exits:
      south:
        target_vnum: 400027
      up:
        target_vnum: 400021
  - vnum: 400027
    name: Rifugio del Ladro
    description: Una stanza nascosta, arredata con poche cose essenziali e molte vie di fuga.
    exits:
      north:
        target_vnum: 400026
      south:
        target_vnum: 400002
  - vnum: 400028
    name: Erboristeria
    description: Mazzi di erbe essiccate pendono dal soffitto, riempiendo l'aria di un profumo pungente.
    exits:
      east:
        target_vnum: 400006
  - vnum: 400029
    name: Pescheria
    description: Banchi di pesce fresco luccicano sotto un velo di ghiaccio, l'odore di mare è ovunque.
    exits:
      east:
        target_vnum: 400007
  - vnum: 400030
    name: Conceria
    description: Pelli tese su telai di legno riempiono la stanza, l'aria pesante di un odore acre.
    exits:
      north:
        target_vnum: 400031
      south:
        target_vnum: 400011
  - vnum: 400031
    name: Armaiolo
    description: Archi, frecce e lame in lavorazione sono appoggiati ordinatamente lungo le pareti.
    exits:
      south:
        target_vnum: 400030
  - vnum: 400032
    name: Taverna
    description: Una sala calda e rumorosa, tavoli di legno consumati dal tempo e un grande focolare acceso.
    exits:
      west:
        target_vnum: 400001
      up:
        target_vnum: 400033
  - vnum: 400033
    name: Locanda
    description: Un piccolo pianerottolo con alcune porte che conducono a camere semplici ma pulite.
    exits:
      down:
        target_vnum: 400032
  - vnum: 400034
    name: Campo di Addestramento
    description: Un campo battuto appena fuori dalle mura, segnato da pali d'allenamento e bersagli consumati.
    sector_type: FIELD
    exits:
      north:
        target_vnum: 400017
  - vnum: 400035
    name: Tempio di Njord
    description: Un piccolo tempio di pietra dedicato a Njord, il mormorio delle onde percepibile anche qui dentro.
    exits:
      south:
        target_vnum: 400017
  - vnum: 400036
    name: Sentiero verso la Torre
    description: Un sentiero stretto si inoltra più a fondo nella foresta, l'aria si fa più fredda a ogni passo.
    sector_type: FOREST
    exits:
      north:
        target_vnum: 400037
      west:
        target_vnum: 400019
  - vnum: 400037
    name: Torre del Mago — Base
    description: L'ingresso di una torre di pietra grigia, scaffali carichi di libri polverosi lungo le pareti.
    exits:
      south:
        target_vnum: 400036
      up:
        target_vnum: 400038
  - vnum: 400038
    name: Torre del Mago — Sommità
    description: In cima alla torre, finestre aperte sulla foresta e strumenti arcani sparsi su un tavolo di pietra.
    exits:
      down:
        target_vnum: 400037
  - vnum: 400039
    name: Sentiero verso il Monastero
    description: Il sentiero sale dolcemente tra le colline, verso un edificio appena visibile in lontananza.
    sector_type: HILLS
    exits:
      north:
        target_vnum: 400019
      south:
        target_vnum: 400040
  - vnum: 400040
    name: Monastero
    description: Un monastero semplice e silenzioso, l'unico suono è quello del vento tra le travi di legno.
    exits:
      north:
        target_vnum: 400039
  - vnum: 400041
    name: Banca di Ravnfjord
    description: Un edificio solido con un bancone robusto e una porta di ferro che conduce a un piccolo caveau.
    exits:
      south:
        target_vnum: 400012
  - vnum: 400042
    name: Vicolo delle Case
    description: Un vicolo tranquillo fiancheggiato da case di legno, panni stesi ad asciugare tra una finestra e l'altra.
    sector_type: CITY
    exits:
      north:
        target_vnum: 400043
      south:
        target_vnum: 400044
      west:
        target_vnum: 400005
  - vnum: 400043
    name: Casa in Vendita
    description: Una casa vuota, pulita e in ordine, in attesa di un nuovo proprietario.
    exits:
      south:
        target_vnum: 400042
  - vnum: 400044
    name: Casa degli Artigiani
    description: Una casa modesta ma accogliente, segno di una famiglia che vive di lavoro manuale.
    exits:
      north:
        target_vnum: 400042
  - vnum: 400045
    name: L'Interno della Grande Hof
    flags:
      - NO_TAKE_ALL
    description: |
      Le massicce pareti di legno di quercia si innalzano imponenti, annerite dal fumo secolare dei focolari e intrise dell'odore aspro di idromele, grasso d'orso e resina. 
      Sotto l'alto soffitto a capriate, sorretto da pilastri intagliati con le sembianze severe degli Asi, regna un silenzio solenne, rotto solo dal crepitio di un braciere sempre acceso al centro della sala.
      Lungo i lati della stanza, lunghe panche di legno scuro corrono vuote, lasciando lo spazio centrale libero per i passi dei viandanti. 
      In fondo alla sala, dove la luce delle fiamme fatica ad arrivare, si erge lo stallr: un maestoso altare di pietra squadrata, parzialmente ricoperto da rune protettive incise nel granito. Sopra di esso riposa un pesante anello d'oro, simbolo di giuramenti inviolabili, circondato da piccole effigi di legno raffiguranti Thor con il suo martello e Odino il Monocolo.
      Una grande {bold}ciotola{!bold} di bronzo è posata al centro dell'{bold}altare{!bold}. 
      È qui che gli avventurieri e i guerrieri di passaggio lasciano i propri tributi per guadagnarsi il favore degli dei e sostenere i nuovi arrivati nel Midgard.
    exits:
      east:
        target_vnum: 400001
    extra_descriptions:
      - keywords: Altare Ciotola
        text: 'Lo stallr di pietra è freddo al tatto, ma emana un''aura di antico potere. La grande ciotola di bronzo funge da raccoglitore per le offerte: oggetti, armi e armature lasciati dai veterani luccicano al suo interno, pronti a essere raccolti da chi ne ha più bisogno. Un''iscrizione runica sul bordo recita: "Un dono cerca sempre un altro dono".'
