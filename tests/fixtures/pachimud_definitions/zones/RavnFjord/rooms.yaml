rooms:
  - vnum: 400000
    name: Piazza del Villaggio
    description: |2
         Ti trovi al centro di Ravnfjord, un piccolo villaggio vichingo stretto
      tra i fiordi e la foresta. Il terreno è battuto e cosparso di paglia, e un
      grande palo runico intagliato si erge al centro della piazza, testimone
      silenzioso dei giuramenti prestati dai guerrieri prima di salpare. Il vento
      porta con sé l'odore di legna bruciata e di sale marino.
    sector_type: CITY
    exits:
      north:
        target_vnum: 400001
        description: |
          La lunga casa del capo villaggio domina il lato nord della piazza.
        keywords: casa lunga longhouse
      east:
        target_vnum: 400010
      south:
        target_vnum: 400006
      west:
        target_vnum: 400004
        description: |
          Verso ovest il sentiero si addentra nella foresta di abeti.
        keywords: foresta sentiero
    extra_descriptions:
      - keywords: palo runico palo rune
        text: |2
             Antiche rune sono incise profondamente nel legno, annerite dal fumo dei
          falò. Nessuno ricorda più con certezza cosa dicano, ma si dice portino
          fortuna a chi le tocca prima di un viaggio.
  - vnum: 400001
    name: Piazza del Mercato
    description: |
      Una piazza acciottolata, bancarelle vuote ai lati. A nord si apre un vicolo buio.
    sector_type: CITY
    exits:
      north:
        target_vnum: 400002
        description: Un vicolo buio si apre a nord.
        keywords: vicolo
        is_male: true
        door_flag: CLOSABLE
        is_open: false
      south:
        target_vnum: 400000
      east:
        target_vnum: 400032
      west:
        target_vnum: 400045
    extra_descriptions:
      - keywords: bancarella banco
        text: Una bancarella vuota, abbandonata da tempo.
  - vnum: 400002
    name: Vicolo Buio
    description: |
      Un vicolo stretto e buio, puzzolente di rifiuti.
    sector_type: CITY
    flags:
      - INDOORS
    exits:
      south:
        target_vnum: 400001
        door_flag: CLOSABLE
        is_open: false
      north:
        target_vnum: 400027
  - vnum: 400003
    name: Fucina di Ravnfjord
    description: |2
         Il calore della forgia riempie l'aria insieme al fumo e all'odore di
      metallo rovente. Un'incudine annerita occupa il centro della stanza,
      circondata da attrezzi da fabbro appesi con cura alle pareti di pietra
      grezza. Scintille danzano nell'ombra ad ogni colpo di martello.
    exits:
      west:
        target_vnum: 400006
  - vnum: 400004
    name: Sentiero nella Foresta
    description: |-
      Alti abeti si stringono attorno a un sentiero coperto di aghi di pino e
      muschio. La luce filtra appena tra i rami, e il silenzio è rotto solo dal
      canto lontano di qualche uccello e dallo scricchiolio del legno mosso dal
      vento.
    sector_type: FOREST
    exits:
      north:
        target_vnum: 400005
      east:
        target_vnum: 400000
  - vnum: 400005
    name: Una Piccola Casa di Legno
    description: Una piccola casa di legno costruita ai margini della foresta, poco distante dal sentiero. È vuota, in attesa di un proprietario.
    exits:
      east:
        target_vnum: 400042
      south:
        target_vnum: 400004
  - vnum: 400006
    name: Viale del mercato
    description: |2-
         Ti trovi all'inizio della via del viale del mercato, subito a sud della piazza centrale di Ravnfjord.
      Tutto intorno ci sono alcuni negozi e mercanti intenti a vendere le loro merci
    sector_type: CITY
    exits:
      north:
        target_vnum: 400000
      east:
        target_vnum: 400003
      south:
        target_vnum: 400007
      west:
        target_vnum: 400028
    extra_descriptions:
      - keywords: mercanti
        text: Sono qui intenti a vendere le loro merci.
      - keywords: negozi negozio
        text: EH son negozi vendono cose
  - vnum: 400007
    name: Viale del mercato
    description: |2-
         Ti trovi alla fine della via del viale del mercato, subito a nord della piazzetta di Njord.
      Tutto intorno ci sono alcuni negozi e mercanti intenti a vendere le loro merci
    sector_type: CITY
    exits:
      north:
        target_vnum: 400006
      east:
        target_vnum: 400009
      south:
        target_vnum: 400008
      west:
        target_vnum: 400029
  - vnum: 400008
    name: Piazzetta di Njord
    description: "   Ti trovi in una piccola piazza di terra battuta e pietre. \nAl centro della piazza c'è una statua scolpita nel legno che rappresenta Njord, dio del mare calmo. Al quale gli abitanti del villaggio rivolgono preghiere per avere viaggi sicuri e pesche abbondanti prima di uscire in mare.\nVerso sud puoi scorgere la Banchina Nord, sul fiordo."
    sector_type: CITY
    exits:
      north:
        target_vnum: 400007
      south:
        target_vnum: 400020
    extra_descriptions:
      - keywords: njord statua
        text: Ci assomiglia davvero.
  - vnum: 400009
    name: Negozio di Jørgen
    description: |2
         L'odore del pesce appeso ad affumicare nel retro penetra anche dentro al negozio.
      Sparsi per il negozio, con ordine opinabile, ci sono barili che contengono alici sotto sale, altri che contengono armi. Qualche scudo appeso alle pareti e molte altre cose poggiate su scaffali o tavolini. Molte non sai a cosa servono.
    exits:
      west:
        target_vnum: 400007
    extra_descriptions:
      - keywords: barili barile
        text: c'è di tutto dentro
      - keywords: armi
        text: C'è un po' di tutto ma mi sa che vende solo quelle nella lista.
      - keywords: alici
        text: Non è il momento di pensare alla colazione
  - vnum: 400010
    name: Inizio del Viale degli Artigiani
    description: |2-
         Originariamente questa era semplicemente la strada che portava alle foreste ad Est del villaggio dove inizialmente c'era solo un campo di addestramento per guerrieri.
      Ma dopo decenni di scambi culturali lungo la via sono sorte varie gilde che insegnano ora vaie arti e stili di combattimento
    sector_type: CITY
